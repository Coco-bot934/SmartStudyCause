services:
  postgres:
    image: postgres:15
    container_name: zhixue-db
    environment:
      POSTGRES_USER: zhixue
      POSTGRES_PASSWORD: zhixue_pass
      POSTGRES_DB: zhixue
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
